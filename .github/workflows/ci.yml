name: CI

# Comprueba en cada push y pull request que el pipeline y los tests de datos pasan.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: Comprobar que el dashboard arranca
        run: |
          python pipeline/export_marts.py
          timeout 20 streamlit run app/streamlit_app.py --server.headless true &
          sleep 15
          curl -sf http://localhost:8501/_stcore/health
